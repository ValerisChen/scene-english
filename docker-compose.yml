# 本地开发用的 PostgreSQL 和 Redis。端口错开默认值，避免和其他项目冲突。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scene
      POSTGRES_PASSWORD: scene
      POSTGRES_DB: scene_english
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6389:6379"

volumes:
  pgdata:
